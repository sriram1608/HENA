<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HENA Saree Studio | Timeless Elegance & Heirloom Sarees</title>
  <meta name="description" content="Discover premium Kanchipuram silk, soft silk, Paithani, Banarasi and designer sarees at HENA Saree Studio. Your Style, Your Saree. Pan-India shipping.">

  <!-- Favicon using HENA logo -->
  <link rel="icon" type="image/jpeg" href="assets/hena-logo.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- React 18 & ReactDOM via CDN (No Node required!) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Static Product Catalog & Customer Reviews Data -->
  <script src="js/products.js"></script>
</head>
<body>
  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Engine -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const FREE_SHIPPING_THRESHOLD = 2999;

    function App() {
      // State
      const [cart, setCart] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hena_cart')) || [];
        } catch {
          return [];
        }
      });

      const [wishlist, setWishlist] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hena_wishlist')) || [];
        } catch {
          return [];
        }
      });

      const [categoryFilter, setCategoryFilter] = useState('all');
      const [sortOrder, setSortOrder] = useState('featured');
      const [searchQuery, setSearchQuery] = useState('');
      
      // UI Modals & Drawers
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isWishlistOpen, setIsWishlistOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isMobileNavOpen, setIsMobileNavOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [couponInput, setCouponInput] = useState('');
      const [toasts, setToasts] = useState([]);
      const [isScrolled, setIsScrolled] = useState(false);

      // Save state to localStorage
      useEffect(() => {
        localStorage.setItem('hena_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('hena_wishlist', JSON.stringify(wishlist));
      }, [wishlist]);

      // Scroll listener for sticky header
      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 30);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Toast notification helper
      const showToast = (message) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 2800);
      };

      // Cart Actions
      const addToCart = (product, e) => {
        if (e) e.stopPropagation();
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, {
            id: product.id,
            title: product.title,
            price: product.price,
            image: product.image,
            category: product.category,
            quantity: 1
          }];
        });
        showToast(`Added "${product.sku || product.title.slice(0, 16)}" to bag!`);
        setIsCartOpen(true);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.id === productId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.id !== productId));
        showToast('Item removed from bag');
      };

      // Wishlist Actions
      const toggleWishlist = (productId, e) => {
        if (e) e.stopPropagation();
        setWishlist(prev => {
          const exists = prev.includes(productId);
          if (exists) {
            showToast('Removed from wishlist');
            return prev.filter(id => id !== productId);
          } else {
            showToast('Saved to your wishlist ❤️');
            return [...prev, productId];
          }
        });
      };

      // Calculations
      const cartTotalCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);
      const rawSubtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
      const discountAmount = useMemo(() => appliedCoupon === 'HENA10' ? Math.round(rawSubtotal * 0.10) : 0, [rawSubtotal, appliedCoupon]);
      const finalTotal = Math.max(0, rawSubtotal - discountAmount);

      // Filtered & Sorted Products
      const filteredProducts = useMemo(() => {
        let list = [...HENA_PRODUCTS];

        if (categoryFilter !== 'all') {
          list = list.filter(p => 
            p.category.toLowerCase().includes(categoryFilter.toLowerCase()) || 
            categoryFilter.toLowerCase().includes(p.category.toLowerCase())
          );
        }

        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          list = list.filter(p => 
            p.title.toLowerCase().includes(q) || 
            p.category.toLowerCase().includes(q) || 
            p.sku.toLowerCase().includes(q) ||
            p.color.toLowerCase().includes(q)
          );
        }

        if (sortOrder === 'price-low') {
          list.sort((a, b) => a.price - b.price);
        } else if (sortOrder === 'price-high') {
          list.sort((a, b) => b.price - a.price);
        } else if (sortOrder === 'discount') {
          list.sort((a, b) => b.discountPercent - a.discountPercent);
        } else if (sortOrder === 'rating') {
          list.sort((a, b) => b.rating - a.rating);
        }

        return list;
      }, [categoryFilter, searchQuery, sortOrder]);

      const handleApplyCoupon = () => {
        const code = couponInput.trim().toUpperCase();
        if (code === 'HENA10') {
          setAppliedCoupon('HENA10');
          showToast('Coupon HENA10 applied: 10% discount added!');
        } else if (code === '') {
          showToast('Please enter a coupon code');
        } else {
          showToast('Invalid coupon. Try HENA10');
        }
      };

      const openWhatsApp = (customMsg) => {
        const msg = encodeURIComponent(customMsg || "Hello HENA Saree Studio! I am interested in purchasing sarees from your latest collection. Please assist me!");
        window.open(`https://wa.me/917305217056?text=${msg}`, '_blank');
      };

      return (
        <div>
          {/* 1. Announcement Bar */}
          <AnnouncementBar />

          {/* 2. Site Header */}
          <Header 
            isScrolled={isScrolled}
            cartCount={cartTotalCount}
            cartSubtotal={rawSubtotal}
            wishlistCount={wishlist.length}
            onOpenMobileNav={() => setIsMobileNavOpen(true)}
            onOpenSearch={() => setIsSearchOpen(true)}
            onOpenWishlist={() => setIsWishlistOpen(true)}
            onOpenCart={() => setIsCartOpen(true)}
            onFilterCategory={(cat) => setCategoryFilter(cat)}
          />

          {/* 3. Hero Carousel Section */}
          <HeroCarouselSection 
            onShopNow={(cat) => {
              setCategoryFilter(cat || 'all');
              document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
            }}
            onExploreCollections={() => {
              document.getElementById('collections-section')?.scrollIntoView({ behavior: 'smooth' });
            }}
          />

          {/* 4. Value Propositions (3 Pillars) */}
          <ValuePropsSection onWhatsApp={() => openWhatsApp()} />

          {/* 5. Featured Collections Grid */}
          <CollectionsSection onSelectCategory={(catName) => {
            setCategoryFilter(catName);
            document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
          }} />

          {/* 6. Products Section with Tabs & Sorting */}
          <NewDropsSection 
            products={filteredProducts}
            currentCategory={categoryFilter}
            onSelectCategory={(cat) => setCategoryFilter(cat)}
            sortOrder={sortOrder}
            onSortChange={(val) => setSortOrder(val)}
            wishlist={wishlist}
            onToggleWishlist={toggleWishlist}
            onAddToCart={addToCart}
            onQuickView={(p) => setQuickViewProduct(p)}
          />

          {/* 7. Bridal & Festive Edit Promo Banner */}
          <PromoEditBanner 
            onExplore={() => {
              setCategoryFilter('Premium Kanchi Silk');
              document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
            }}
            onBookVideoCall={() => openWhatsApp("Hello HENA Saree Studio, I would like to schedule a virtual video shopping call for bridal sarees.")}
          />

          {/* 8. Customer Reviews & Testimonials */}
          <CustomerReviewsSection />

          {/* 9. Store Visit & Newsletter */}
          <StoreVisitSection 
            onDirections={() => openWhatsApp("Hello! I would like to get directions to visit HENA Saree Studio in Perambur, Chennai.")}
            onNewsletterJoin={(email) => showToast(`🎉 Thank you for joining! Your ₹500 discount code is: HENA500`)}
          />

          {/* 10. Footer */}
          <Footer onSelectCategory={(cat) => {
            setCategoryFilter(cat);
            document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
          }} />

          {/* Floating WhatsApp Action Button */}
          <FloatingWhatsApp onChat={() => openWhatsApp()} />

          {/* Toast Notification Container */}
          <ToastContainer toasts={toasts} />

          {/* Mobile Navigation Drawer */}
          <MobileNavDrawer 
            isOpen={isMobileNavOpen}
            onClose={() => setIsMobileNavOpen(false)}
            onSelectCategory={(cat) => {
              setCategoryFilter(cat);
              setIsMobileNavOpen(false);
              document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
            }}
          />

          {/* Cart Drawer */}
          <CartDrawer 
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            cart={cart}
            rawSubtotal={rawSubtotal}
            discountAmount={discountAmount}
            finalTotal={finalTotal}
            appliedCoupon={appliedCoupon}
            couponInput={couponInput}
            onCouponChange={(val) => setCouponInput(val)}
            onApplyCoupon={handleApplyCoupon}
            onUpdateQty={updateCartQuantity}
            onRemove={removeFromCart}
            onProceedCheckout={() => {
              setIsCartOpen(false);
              setIsCheckoutOpen(true);
            }}
            onShopSarees={() => {
              setIsCartOpen(false);
              setCategoryFilter('all');
              document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
            }}
          />

          {/* Wishlist Drawer */}
          <WishlistDrawer 
            isOpen={isWishlistOpen}
            onClose={() => setIsWishlistOpen(false)}
            wishlist={wishlist}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
          />

          {/* Search Modal */}
          <SearchModal 
            isOpen={isSearchOpen}
            onClose={() => setIsSearchOpen(false)}
            searchQuery={searchQuery}
            onSearchChange={(val) => setSearchQuery(val)}
            onSelectProduct={(p) => {
              setQuickViewProduct(p);
              setIsSearchOpen(false);
            }}
          />

          {/* Quick View Modal */}
          <QuickViewModal 
            product={quickViewProduct}
            onClose={() => setQuickViewProduct(null)}
            onAddToCart={(p) => {
              addToCart(p);
              setQuickViewProduct(null);
            }}
            onBuyNow={(p) => {
              addToCart(p);
              setQuickViewProduct(null);
              setIsCheckoutOpen(true);
            }}
          />

          {/* Checkout Demo Modal */}
          <CheckoutModal 
            isOpen={isCheckoutOpen}
            onClose={() => setIsCheckoutOpen(false)}
            cart={cart}
            finalTotal={finalTotal}
            onOrderSuccess={(orderData) => {
              setCart([]);
              showToast(`🎉 Order ${orderData.orderNum} placed successfully!`);
            }}
          />
        </div>
      );
    }

    // ========================================================================
    // REACT SUB-COMPONENTS
    // ========================================================================

    function AnnouncementBar() {
      return (
        <div className="announcement-bar">
          <div className="announcement-marquee">
            <div className="announcement-item">
              <span>📍 <strong>BOUTIQUE ADDRESS:</strong> I K TOWER, 222/161 MPM STREET, PERAMBUR, CHENNAI - 39</span>
            </div>
            <span className="announcement-divider">|</span>
            <div className="announcement-item">
              <span>✨ <strong>FREE SHIPPING</strong> ON ALL ORDERS ABOVE ₹2,999 ACROSS INDIA ✨</span>
            </div>
            <span className="announcement-divider">|</span>
            <div className="announcement-item">
              <span>USE CODE: <span className="highlight">HENA10</span> FOR EXTRA 10% OFF</span>
            </div>
          </div>
        </div>
      );
    }

    function Header({ isScrolled, cartCount, cartSubtotal, wishlistCount, onOpenMobileNav, onOpenSearch, onOpenWishlist, onOpenCart, onFilterCategory }) {
      return (
        <header className={`site-header ${isScrolled ? 'is-scrolled' : ''}`}>
          <div className="header-container">
            
            {/* Left: Brand Logo & Mobile Trigger */}
            <div className="header-left">
              <button className="mobile-menu-btn" onClick={onOpenMobileNav} aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
              </button>

              <a href="#" className="brand-logo-link" title="HENA Saree Studio">
                <img className="brand-logo-img" src="assets/hena-logo.jpg" alt="HENA Saree Studio Logo" />
                <div className="brand-text-block">
                  <span className="brand-title">HENA</span>
                  <span className="brand-tagline">Saree Studio</span>
                </div>
              </a>
            </div>

            {/* Center: Desktop Navigation Links */}
            <div className="header-center">
              <ul className="nav-links-desktop">
                <li><a href="#" className="nav-link active">Home</a></li>
                
                {/* Categories Mega Dropdown */}
                <li>
                  <a href="#collections-section" className="nav-link">
                    Our Categories
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </a>
                  <div className="nav-dropdown">
                    {HENA_CATEGORIES.filter(c => c.slug !== 'all').slice(0, 6).map(cat => (
                      <a key={cat.slug} href="#products-section" className="nav-dropdown-item" onClick={() => onFilterCategory(cat.name)}>
                        <img src={cat.image} alt={cat.name} />
                        <div className="nav-dropdown-info">
                          <h4>{cat.name}</h4>
                          <span>{cat.count} Designs</span>
                        </div>
                      </a>
                    ))}
                  </div>
                </li>

                <li>
                  <a href="#products-section" className="nav-link" onClick={() => onFilterCategory('All Sarees')}>
                    Sale <span className="sale-badge-pill">HOT</span>
                  </a>
                </li>
                <li><a href="#collections-section" className="nav-link">Best Sellers</a></li>
                <li><a href="#products-section" className="nav-link">New Drops</a></li>
                <li><a href="#reviews-section" className="nav-link">Reviews</a></li>
                <li><a href="#store-visit-section" className="nav-link">Contact</a></li>
              </ul>
            </div>

            {/* Right: Currency & Interactive Shopping Actions */}
            <div className="header-right">
              <span style={{ fontSize: '13px', fontWeight: 600, color: 'var(--color-text-muted)', cursor: 'pointer' }}>
                🇮🇳 INR (₹)
              </span>

              <button className="header-action-btn" onClick={onOpenSearch} title="Search Sarees">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>

              <button className="header-action-btn" onClick={onOpenWishlist} title="Saved Sarees">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span className="header-badge">{wishlistCount}</span>
              </button>

              <button className="cart-summary-btn" onClick={onOpenCart} title="Shopping Bag">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span>₹{cartSubtotal.toLocaleString('en-IN')}</span>
                <span className="header-badge" style={{ position: 'static', marginLeft: '4px' }}>{cartCount}</span>
              </button>
            </div>

          </div>
        </header>
      );
    }

    const HERO_SLIDES = [
      {
        id: 1,
        image: "https://cdn.shopify.com/s/files/1/0882/8734/6990/files/PKA884_1.jpg?v=1760773752",
        kicker: "✦ Handcrafted Heirloom Silks ✦",
        title: "The Royal Festive Edit 2026",
        subtitle: '"Your Style, Your Saree" — Step into timeless sophistication with our exclusive collection of pure Kanchipuram silk, soft silk, Paithani, and Banarasi drapes.',
        primaryCta: "Shop New Drops",
        secondaryCta: "View Collections",
        category: "Premium Kanchi Silk"
      },
      {
        id: 2,
        image: "https://cdn.shopify.com/s/files/1/0882/8734/6990/files/DESJ96_3.jpg?v=1775991777",
        kicker: "✦ Contemporary Elegance ✦",
        title: "Exclusive Designer Sarees",
        subtitle: "Intricate zari borders, floral jaal, and feather-light textures handcrafted for celebrations, weddings, and grand occasions.",
        primaryCta: "Explore Designer Edit",
        secondaryCta: "View Best Sellers",
        category: "Designer Saree"
      },
      {
        id: 3,
        image: "https://cdn.shopify.com/s/files/1/0882/8734/6990/files/WhatsApp_Image_2025-09-18_at_5.21.51_PM_197481fd-0a57-40c9-af2e-95ca9e253327.jpg?v=1758260370",
        kicker: "✦ Shimmer & Grace ✦",
        title: "Chinnon & Tissue Silks",
        subtitle: "Radiant jewel tones crafted with luminous weaves and delicate craftsmanship to make every moment memorable.",
        primaryCta: "Shop Chinnon Sarees",
        secondaryCta: "All Collections",
        category: "Chinnon Sarees"
      },
      {
        id: 4,
        image: "https://cdn.shopify.com/s/files/1/0882/8734/6990/files/MCL4-2_6baafe78-bed3-460c-9187-af0c72fadee8.jpg?v=1756793457",
        kicker: "✦ Breathable Luxury ✦",
        title: "Metallic Crushed Linen",
        subtitle: "Effortless day-to-evening drape blending festive shimmer with airy organic linen for unmatched comfort.",
        primaryCta: "Shop Linen Edit",
        secondaryCta: "View All Sarees",
        category: "Metallic Linen"
      }
    ];

    function HeroCarouselSection({ onShopNow, onExploreCollections }) {
      const [currentSlide, setCurrentSlide] = useState(0);
      const [isHovered, setIsHovered] = useState(false);

      useEffect(() => {
        if (isHovered) return;
        const timer = setInterval(() => {
          setCurrentSlide(prev => (prev + 1) % HERO_SLIDES.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [isHovered]);

      const nextSlide = () => {
        setCurrentSlide(prev => (prev + 1) % HERO_SLIDES.length);
      };

      const prevSlide = () => {
        setCurrentSlide(prev => (prev - 1 + HERO_SLIDES.length) % HERO_SLIDES.length);
      };

      return (
        <section 
          className="hero-carousel-section"
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
        >
          {HERO_SLIDES.map((slide, idx) => (
            <div 
              key={slide.id}
              className={`carousel-slide ${idx === currentSlide ? 'active' : ''}`}
            >
              <img 
                src={slide.image} 
                alt={slide.title} 
                className="carousel-img-bg"
              />
              <div className="carousel-overlay">
                <div className="carousel-content">
                  <span className="hero-kicker">{slide.kicker}</span>
                  <h1 className="hero-title">{slide.title}</h1>
                  <p className="hero-subtitle">{slide.subtitle}</p>
                  <div className="hero-cta-group">
                    <button className="btn-primary" onClick={() => onShopNow(slide.category)}>
                      {slide.primaryCta} &rarr;
                    </button>
                    <button className="btn-secondary" onClick={onExploreCollections}>
                      {slide.secondaryCta}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ))}

          {/* Previous & Next Arrows */}
          <button 
            className="carousel-nav-btn carousel-nav-prev" 
            onClick={prevSlide}
            aria-label="Previous slide"
          >
            &#10094;
          </button>
          <button 
            className="carousel-nav-btn carousel-nav-next" 
            onClick={nextSlide}
            aria-label="Next slide"
          >
            &#10095;
          </button>

          {/* Dots / Indicators */}
          <div className="carousel-indicators">
            {HERO_SLIDES.map((_, idx) => (
              <button 
                key={idx}
                className={`indicator-dot ${idx === currentSlide ? 'active' : ''}`}
                onClick={() => setCurrentSlide(idx)}
                aria-label={`Go to slide ${idx + 1}`}
              />
            ))}
          </div>
        </section>
      );
    }

    function ValuePropsSection({ onWhatsApp }) {
      return (
        <section className="value-props-section">
          <div className="container">
            <div className="value-props-grid">
              
              <div className="value-prop-card">
                <div className="value-prop-icon">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                  </svg>
                </div>
                <div className="value-prop-text">
                  <h4>Elite Boutique Service</h4>
                  <p>Choose us for the finest authentic handloom sarees with guaranteed Silk Mark quality.</p>
                </div>
              </div>

              <div className="value-prop-card">

      const neededForFreeShipping = Math.max(0, FREE_SHIPPING_THRESHOLD - rawSubtotal);
      const shippingPct = Math.min(100, Math.round((rawSubtotal / FREE_SHIPPING_THRESHOLD) * 100));

      return (
        <div className={`drawer-backdrop ${isOpen ? 'is-open' : ''}`} onClick={onClose}>

                <span>Add <strong>₹{neededForFreeShipping.toLocaleString('en-IN')}</strong> more for <strong>FREE Pan-India Shipping</strong>!</span>

    }

    function SearchModal({ isOpen, onClose, searchQuery, onSearchChange, onSelectProduct }) {
      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        return HENA_PRODUCTS.filter(p => 
          p.title.toLowerCase().includes(q) || 
          p.category.toLowerCase().includes(q) || 
          p.sku.toLowerCase().includes(q)
        ).slice(0, 8);
      }, [searchQuery]);

      return (
        <div className={`search-modal ${isOpen ? 'is-open' : ''}`}>
          <div className="search-input-box">
            <svg className="search-icon-inside" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              className="search-input" 
              placeholder="Search by saree type, color, or design code (e.g. Kanchi, Banarasi, SS553)..."
              value={searchQuery}
              onChange={(e) => onSearchChange(e.target.value)}
              autoFocus={isOpen}
            />
            <button className="close-search-btn" onClick={onClose}>Close</button>
          </div>

          <div className="search-results-preview">
            {searchQuery.trim() !== '' && searchResults.length === 0 && (
              <p style={{ gridColumn: '1 / -1', color: 'var(--color-text-muted)', textAlign: 'center', padding: '20px' }}>
                No matching sarees found for "{searchQuery}"
              </p>
            )}
            {searchResults.map(p => (
              <div 
                key={p.id} 
                className="cart-item-card" 
                style={{ cursor: 'pointer', background: '#FFF', padding: '8px', borderRadius: 'var(--radius-xs)', border: '1px solid var(--color-border)' }}
                onClick={() => onSelectProduct(p)}
              >
                <img src={p.image} style={{ width: '50px', height: '64px', objectFit: 'cover', borderRadius: '2px' }} alt={p.title} />
                <div>
                  <h5 style={{ fontSize: '12.5px', fontWeight: 600, marginBottom: '2px' }}>{p.title}</h5>
                  <span style={{ fontSize: '12px', fontWeight: 700, color: 'var(--color-maroon)' }}>₹{p.price.toLocaleString('en-IN')}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function QuickViewModal({ product, onClose, onAddToCart, onBuyNow }) {
      if (!product) return null;

      return (
        <div className="modal-backdrop is-open" onClick={onClose}>
          <div className="quickview-dialog" onClick={(e) => e.stopPropagation()}>
            <button className="quickview-close-btn" onClick={onClose}>&times;</button>

            <div className="quickview-media">
              <img className="quickview-img" src={product.image} alt={product.title} />
            </div>

            <div className="quickview-content">
              <span className="quickview-sku">SKU: {product.sku} | {product.category}</span>
              <h3 className="quickview-title">{product.title}</h3>

              <div className="quickview-price-box">
                <span className="quickview-price">₹{product.price.toLocaleString('en-IN')}</span>
                <span className="quickview-compare">₹{product.comparePrice.toLocaleString('en-IN')}</span>
                <span className="badge-discount">Save {product.discountPercent}%</span>
              </div>

              <ul className="specs-list">
                <li><strong>Fabric:</strong> <span>{product.fabric}</span></li>
                <li><strong>Blouse:</strong> <span>{product.blouse}</span></li>
                <li><strong>Length:</strong> <span>{product.length}</span></li>
                <li><strong>Wash Care:</strong> <span>{product.washCare}</span></li>
                <li><strong>Delivery:</strong> <span>{product.deliveryTime}</span></li>
              </ul>

              <div className="quickview-actions">
                <button className="btn-primary" style={{ flex: 1 }} onClick={() => onAddToCart(product)}>
                  Add to Bag
                </button>
                <button className="btn-secondary" style={{ flex: 1, background: 'var(--color-maroon)', color: '#FFF', borderColor: 'var(--color-maroon)' }} onClick={() => onBuyNow(product)}>
                  Buy Now
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CheckoutModal({ isOpen, onClose, cart, finalTotal, onOrderSuccess }) {
      const [orderSubmitted, setOrderSubmitted] = useState(false);
      const [orderInfo, setOrderInfo] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        address: '',
        payment: 'Instant UPI / QR Code (GPay, PhonePe, Paytm)'
      });

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const orderNum = 'HENA-' + Math.floor(100000 + Math.random() * 900000);
        const data = {
          orderNum,
          name: formData.name || 'Valued Customer',
          phone: formData.phone,
          payment: formData.payment,
          total: finalTotal
        };
        setOrderInfo(data);
        setOrderSubmitted(true);
        onOrderSuccess(data);
      };

      return (
        <div className="modal-backdrop is-open" onClick={onClose}>
          <div className="quickview-dialog" style={{ maxWidth: '640px', display: 'block' }} onClick={(e) => e.stopPropagation()}>
            <button className="quickview-close-btn" onClick={onClose}>&times;</button>
            
            <div style={{ padding: '32px' }}>
              {!orderSubmitted ? (
                <div>
                  <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '26px', color: 'var(--color-maroon)', marginBottom: '6px' }}>Secure Checkout</h3>
                  <p style={{ fontSize: '13.5px', color: 'var(--color-text-muted)', marginBottom: '20px' }}>
                    Order Summary: <strong>{cart.length} item(s)</strong> • Final Total: <strong style={{ color: 'var(--color-maroon)' }}>₹{finalTotal.toLocaleString('en-IN')}</strong>
                  </p>

                  <form onSubmit={handleSubmit}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                      <div>
                        <label style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase' }}>Full Name</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="e.g. Radhika Sundaram" 
                          style={{ width: '100%', padding: '10px', border: '1px solid var(--color-border)', borderRadius: '2px' }}
                          value={formData.name}
                          onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        />
                      </div>
                      <div>
                        <label style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase' }}>WhatsApp / Mobile No.</label>
                        <input 
                          type="tel" 
                          required 
                          placeholder="e.g. 9876543210" 
                          style={{ width: '100%', padding: '10px', border: '1px solid var(--color-border)', borderRadius: '2px' }}
                          value={formData.phone}
                          onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        />
                      </div>
                    </div>

                    <div style={{ marginBottom: '12px' }}>
                      <label style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase' }}>Delivery Address (House No, Street, City, Pincode)</label>
                      <textarea 
                        required 
                        rows="2" 
                        placeholder="Full postal delivery address..." 
                        style={{ width: '100%', padding: '10px', border: '1px solid var(--color-border)', borderRadius: '2px' }}
                        value={formData.address}
                        onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                      ></textarea>
                    </div>

                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', display: 'block', marginBottom: '8px' }}>Select Payment Mode</label>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '13.5px' }}>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }}>
                          <input 
                            type="radio" 
                            name="payment" 
                            value="Instant UPI / QR Code (GPay, PhonePe, Paytm)" 
                            checked={formData.payment === 'Instant UPI / QR Code (GPay, PhonePe, Paytm)'} 
                            onChange={(e) => setFormData({ ...formData, payment: e.target.value })}
                          />
                          <span><strong>Instant UPI / QR Code</strong> (GPay, PhonePe, Paytm) — Instant Order Confirmation</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }}>
                          <input 
                            type="radio" 
                            name="payment" 
                            value="Debit / Credit Card & Net Banking" 
                            checked={formData.payment === 'Debit / Credit Card & Net Banking'}
                            onChange={(e) => setFormData({ ...formData, payment: e.target.value })}
                          />
                          <span><strong>Debit / Credit Card / Net Banking</strong> (Visa, Mastercard, RuPay)</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }}>
                          <input 
                            type="radio" 
                            name="payment" 
                            value="Cash on Delivery (COD)" 
                            checked={formData.payment === 'Cash on Delivery (COD)'}
                            onChange={(e) => setFormData({ ...formData, payment: e.target.value })}
                          />
                          <span><strong>Cash on Delivery (COD)</strong> (Verified via WhatsApp OTP)</span>
                        </label>
                      </div>
                    </div>

                    <button type="submit" className="btn-primary" style={{ width: '100%', padding: '14px', fontSize: '14px' }}>
                      Place Order with HENA Saree Studio
                    </button>
                  </form>
                </div>
              ) : (
                <div style={{ textAlign: 'center', padding: '20px 10px' }}>
                  <div style={{ width: '72px', height: '72px', background: '#E8F5E9', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px', color: '#2E7D32' }}>
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                  <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '32px', color: 'var(--color-maroon)', marginBottom: '8px' }}>Order Placed Successfully!</h3>
                  <p style={{ fontSize: '15px', color: 'var(--color-text)', marginBottom: '8px' }}>Thank you, <strong>{orderInfo?.name}</strong>!</p>
                  <p style={{ fontSize: '14px', color: 'var(--color-text-muted)', marginBottom: '24px' }}>Your order reference number is <strong>{orderInfo?.orderNum}</strong>. A confirmation message will be sent to <strong>{orderInfo?.phone}</strong> via WhatsApp and SMS.</p>
                  
                  <div style={{ background: 'var(--color-surface)', padding: '16px', borderRadius: 'var(--radius-xs)', border: '1px solid var(--color-border)', maxWidth: '400px', margin: '0 auto 24px', textAlign: 'left', fontSize: '13.5px' }}>
                    <p><strong>Payment Mode:</strong> {orderInfo?.payment}</p>
                    <p><strong>Order Amount:</strong> ₹{orderInfo?.total.toLocaleString('en-IN')}</p>
                    <p><strong>Estimated Dispatch:</strong> Within 24-48 Hours</p>
                    <p><strong>Courier:</strong> Bluedart / DTDC Express with Live Tracking</p>
                  </div>

                  <button className="btn-primary" onClick={onClose}>Continue Shopping</button>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    function MobileNavDrawer({ isOpen, onClose, onSelectCategory }) {
      return (
        <div className={`drawer-backdrop ${isOpen ? 'is-open' : ''}`} onClick={onClose}>
          <div className="cart-drawer" style={{ left: 0, right: 'auto', transform: isOpen ? 'translateX(0)' : 'translateX(-100%)' }} onClick={(e) => e.stopPropagation()}>
            <div className="cart-drawer-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <img src="assets/hena-logo.jpg" style={{ width: '36px', height: '36px', borderRadius: '50%' }} alt="Logo" />
                <span style={{ fontFamily: 'var(--font-serif)', fontSize: '18px', fontWeight: 700, color: 'var(--color-maroon)' }}>HENA STUDIO</span>
              </div>
              <button className="close-drawer-btn" onClick={onClose}>&times;</button>
            </div>

            <div style={{ padding: '24px', display: 'flex', flexDirection: 'column', gap: '16px', overflowY: 'auto' }}>
              <a href="#" style={{ fontSize: '15px', fontWeight: 600, textTransform: 'uppercase' }} onClick={onClose}>Home</a>
              <a href="#collections-section" style={{ fontSize: '15px', fontWeight: 600, textTransform: 'uppercase' }} onClick={onClose}>Best Selling Collections</a>
              <a href="#products-section" style={{ fontSize: '15px', fontWeight: 600, textTransform: 'uppercase' }} onClick={() => onSelectCategory('all')}>New Drops</a>
              <a href="#products-section" style={{ fontSize: '15px', fontWeight: 600, textTransform: 'uppercase', color: '#E53935' }} onClick={() => onSelectCategory('all')}>Sale & Clearance (Up to 30% Off)</a>
              
              <div style={{ borderTop: '1px solid var(--color-border-light)', paddingTop: '16px', marginTop: '8px' }}>
                <h5 style={{ fontSize: '12px', color: 'var(--color-gold-dark)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: '12px' }}>Browse By Fabric</h5>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '14px' }}>
                  <a href="#products-section" onClick={() => onSelectCategory('Kanchi Soft Silk')}>Kanchi Soft Silk</a>
                  <a href="#products-section" onClick={() => onSelectCategory('Semi Banarasi Soft Silk')}>Semi Banarasi Silk</a>
                  <a href="#products-section" onClick={() => onSelectCategory('Paithani Silk')}>Paithani Silk</a>
                  <a href="#products-section" onClick={() => onSelectCategory('Premium Kanchi Silk')}>Premium Kanchipuram</a>
                  <a href="#products-section" onClick={() => onSelectCategory('Designer Saree')}>Designer Sarees</a>
                  <a href="#products-section" onClick={() => onSelectCategory('Jewellery')}>Antique Jewellery</a>
                </div>
              </div>

              <div style={{ borderTop: '1px solid var(--color-border-light)', paddingTop: '16px', marginTop: '8px', fontSize: '13.5px', color: 'var(--color-text-muted)' }}>
                <p><strong>Studio Address:</strong><br />I K TOWER, 222/161 MPM Street, Perambur, Chennai - 39</p>
                <p style={{ marginTop: '8px' }}><strong>WhatsApp:</strong> +91 7305217056</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function FloatingWhatsApp({ onChat }) {
      return (
        <div className="floating-whatsapp-btn" onClick={onChat} title="Chat with HENA Stylists on WhatsApp">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.41a8.217 8.217 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.47c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.78 2.71 4.3 3.8 2.53 1.09 2.53.73 2.99.69.45-.04 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.17-.48-.29z"/>
          </svg>
        </div>
      );
    }

    function ToastContainer({ toasts }) {
      return (
        <div className="toast-container">
          {toasts.map(t => (
            <div key={t.id} className="toast-msg">
              <span>✦</span>
              <span>{t.message}</span>
            </div>
          ))}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
